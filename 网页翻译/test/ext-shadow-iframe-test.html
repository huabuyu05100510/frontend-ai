<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>W2-3 Shadow DOM + iframe test</title>
  <style>
    body { font: 14px/1.5 system-ui; padding: 20px; }
    h1 { color: #1a73e8; }
    iframe { width: 100%; height: 100px; border: 1px solid #ccc; margin: 10px 0; }
    my-widget { display: block; padding: 10px; background: #f5f5f5; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>Top frame heading text here</h1>
  <p>This is a top frame paragraph with enough text to be extracted properly.</p>

  <h2>Shadow DOM section</h2>
  <my-widget></my-widget>

  <h2>Same-origin iframe section</h2>
  <iframe src="iframe-inner.html"></iframe>

  <h2>Cross-origin iframe section</h2>
  <iframe src="https://example.com/"></iframe>

  <script>
    // Web component with shadow DOM
    customElements.define('my-widget', class extends HTMLElement {
      connectedCallback() {
        if (this.shadowRoot) return // already attached
        const shadow = this.attachShadow({ mode: 'open' })
        shadow.innerHTML = `
          <p>Shadow DOM paragraph content needs translation here</p>
          <div>Another shadow DOM text block for testing coverage</div>
        `
      }
    })
  </script>
</body>
</html>
