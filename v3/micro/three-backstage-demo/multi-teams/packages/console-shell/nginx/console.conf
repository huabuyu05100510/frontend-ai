# =============================================================================
# multi-teams: Console Shell + 三个独立子应用（Nginx 路由代理）
#
# 关键点：
#   1. Shell 与子应用分别部署到不同域名/端口
#   2. iframe 通过同主域 Cookie 共享登录态
#   3. Shell 不耦合任何子应用代码，仅作为路由分发器
# =============================================================================

# ---------- 端口分配 ----------
# Shell (平台架构组):       https://console.example.com/  → 5180
# 系统 A (团队 A):         https://a.example.com/        → 5181
# 系统 B (团队 B):         https://b.example.com/        → 5182
# 系统 C (团队 C):         https://c.example.com/        → 5183

# ---------- 上游 ----------
upstream shell_upstream {
    server 127.0.0.1:5180;
    keepalive 16;
}

upstream system_a_upstream {
    server 127.0.0.1:5181;
    keepalive 8;
}

upstream system_b_upstream {
    server 127.0.0.1:5182;
    keepalive 8;
}

upstream system_c_upstream {
    server 127.0.0.1:5183;
    keepalive 8;
}

# =============================================================================
# Server 1: Shell 一站式入口 console.example.com
# =============================================================================
server {
    listen 443 ssl http2;
    server_name console.example.com;

    ssl_certificate     /etc/ssl/certs/example.com.crt;
    ssl_certificate_key /etc/ssl/private/example.com.key;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;

    # SPA fallback
    location / {
        root /var/www/console-shell/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 长缓存
    location /assets/ {
        root /var/www/console-shell/dist;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}

# =============================================================================
# Server 2/3/4: 三个子应用独立域名（每个团队独立维护）
# 关键：子应用独立部署，独立域名，iframe 直接嵌入
# =============================================================================
server {
    listen 443 ssl http2;
    server_name a.example.com;

    ssl_certificate     /etc/ssl/certs/example.com.crt;
    ssl_certificate_key /etc/ssl/private/example.com.key;

    gzip on;

    # SPA fallback
    location / {
        root /var/www/team-a/user-center/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        root /var/www/team-a/user-center/dist;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

server {
    listen 443 ssl http2;
    server_name b.example.com;

    ssl_certificate     /etc/ssl/certs/example.com.crt;
    ssl_certificate_key /etc/ssl/private/example.com.key;

    gzip on;

    location / {
        root /var/www/team-b/order-center/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        root /var/www/team-b/order-center/dist;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

server {
    listen 443 ssl http2;
    server_name c.example.com;

    ssl_certificate     /etc/ssl/certs/example.com.crt;
    ssl_certificate_key /etc/ssl/private/example.com.key;

    gzip on;

    location / {
        root /var/www/team-c/product-center/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        root /var/www/team-c/product-center/dist;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# =============================================================================
# Server 5: HTTP → HTTPS
# =============================================================================
server {
    listen 80;
    server_name console.example.com a.example.com b.example.com c.example.com;
    return 301 https://$host$request_uri;
}

# =============================================================================
# Server 6: 本地开发（多端口代理）
# 浏览器访问 http://console.local/ → vite dev server on 5180
# 浏览器访问 http://a.local/        → vite dev server on 5181
# =============================================================================
server {
    listen 80;
    server_name console.local;

    location / {
        proxy_pass http://127.0.0.1:5180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name a.local;

    location / {
        proxy_pass http://127.0.0.1:5181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name b.local;

    location / {
        proxy_pass http://127.0.0.1:5182;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name c.local;

    location / {
        proxy_pass http://127.0.0.1:5183;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}