# =============================================================================
# 三个中后台整合 - Nginx 配置
#
# 核心原则：
# 1. 所有二级域名（a/b/c.example.com） + 一级入口（console.example.com）
#    指向【同一份】SPA 构建产物
# 2. 绝不能 301 重定向老域名 → 会触发整页刷新，Header/Menu 重建
# 3. SPA fallback: try_files $uri $uri/ /index.html
# 4. 静态资源长缓存，HTML 永远协商缓存
# 5. API 单独转发，不走 SPA fallback
# =============================================================================

# ---------- 上游：构建产物 ----------
# 生产环境构建产物目录
# 构建命令：npm run build → 产物在 dist/
upstream spa_assets {
    # 本地文件直接服务（也可以指向 CDN / 对象存储）
    server unix:/var/run/nginx-spa.sock;
}

# ---------- 上游：后端 API（演示用，可选） ----------
upstream auth_api {
    server auth.internal:3000;
}

upstream api_gateway {
    server api.internal:8080;
}

# =============================================================================
# Server 1: 一站式入口 console.example.com
# basename = ''（根路径）
# =============================================================================
server {
    listen 443 ssl http2;
    server_name console.example.com;

    ssl_certificate     /etc/ssl/certs/example.com.crt;
    ssl_certificate_key /etc/ssl/private/example.com.key;

    root /var/www/console-spa/dist;
    index index.html;

    # 安全 / 性能 头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # ---------- 健康检查 ----------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---------- API 路由（不走 SPA fallback） ----------
    location /api/ {
        proxy_pass http://api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /auth/ {
        proxy_pass http://auth_api;
        proxy_set_header Host $host;
        # ⭐ 关键：登录 Cookie 域设为顶级域，所有子域共享
        proxy_hide_header Set-Cookie;
        proxy_pass_header Set-Cookie;
        # 配合后端 Set-Cookie 时指定 Domain=.example.com
    }

    # ---------- 静态资源：长缓存（带 hash 文件名） ----------
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 字体、图片
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # ---------- SPA fallback ----------
    # 所有未匹配到的请求 → /index.html（HTTP 200，不是 3xx）
    location / {
        add_header Cache-Control "no-cache";   # HTML 永远协商缓存
        try_files $uri $uri/ /index.html;
    }

    # 错误页交给 SPA 的 404 路由处理
    error_page 404 /index.html;
}

# =============================================================================
# Server 2/3/4: 老域名入口（a/b/c.example.com）
# 全部指向同一份 SPA，basename 由前端 hostname 自动判断
# 绝不能用 301 跳转到 console！
# =============================================================================
server {
    listen 443 ssl http2;
    server_name a.example.com b.example.com c.example.com;

    ssl_certificate     /etc/ssl/certs/example.com.crt;
    ssl_certificate_key /etc/ssl/private/example.com.key;

    # ⭐ 关键：与 console.example.com 指向完全一致的构建产物
    root /var/www/console-spa/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json;

    # 静态资源
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    # ⭐ 关键：SPA fallback，与 console 完全一致
    # 前端根据 window.location.hostname 自动决定 basename：
    #   a.example.com → /system-a
    #   b.example.com → /system-b
    #   c.example.com → /system-c
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}

# =============================================================================
# Server 5: HTTP → HTTPS 重定向（仅用于生产）
# =============================================================================
server {
    listen 80;
    server_name console.example.com a.example.com b.example.com c.example.com;
    return 301 https://$host$request_uri;
}

# =============================================================================
# Server 6: 本地开发（可选，仅用于本地模拟多域名）
# =============================================================================
server {
    listen 80;
    server_name console.local a.local b.local c.local;

    root /Users/didi/Downloads/前端AI面试题/v3/micro/three-backstage-demo/dist;
    index index.html;

    location /assets/ {
        expires off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}