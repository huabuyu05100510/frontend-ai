# =============================================================================
# 开发环境 Nginx 反向代理配置（可选）
#
# 场景：本地同时跑着 vite dev server (5173 / 5180) 和多个子系统的 API 服务，
#       用 Nginx 代理实现：
#       - console.local → http://127.0.0.1:5180
#       - api.local/api/ → http://localhost:8080
#       - 同时设置 Cookie 域为 .local 让多域名共享登录态
#
# 使用：
#   1. 修改 /etc/hosts（macOS / Linux）：
#      127.0.0.1 console.local a.local b.local c.local api.local auth.local
#
#   2. 把 dev-proxy.conf 软链到 nginx 配置目录：
#      ln -s $(pwd)/dev-proxy.conf /opt/homebrew/etc/nginx/servers/console-dev.conf
#      # 或 sudo cp dev-proxy.conf /etc/nginx/conf.d/console-dev.conf
#
#   3. 测试配置：nginx -t
#   4. 重启：brew services restart nginx  或  sudo nginx -s reload
#
#   5. 浏览器访问：
#      - http://console.local         → 一站式入口（basename = ''）
#      - http://a.local/user/list     → 老域名入口（basename = /system-a）
#      - http://b.local/order/pending → 老域名入口（basename = /system-b）
#      - http://c.local/product/list  → 老域名入口（basename = /system-c）
# =============================================================================

# ---------- 上游：Vite dev server ----------
upstream vite_dev {
    server 127.0.0.1:5180;
    keepalive 32;
}

# ---------- 上游：后端 API（演示，可选） ----------
# upstream dev_api {
#     server 127.0.0.1:8080;
#     keepalive 16;
# }

# =============================================================================
# 主入口 console.local
# =============================================================================
server {
    listen 80;
    server_name console.local;

    # 日志
    access_log /tmp/console.local.access.log;
    error_log  /tmp/console.local.error.log warn;

    # 公共头
    add_header X-Dev-Mode "true" always;

    # ---------- API 转发 ----------
    location /api/ {
        # proxy_pass http://dev_api;
        # 这里直接回 404 模拟无后端
        return 404 '{"error":"dev api not configured"}';
        add_header Content-Type application/json;
    }

    location /auth/ {
        # 同上
        return 404 '{"error":"dev auth not configured"}';
        add_header Content-Type application/json;
    }

    # ---------- Vite HMR / WebSocket ----------
    location /@vite/ {
        proxy_pass http://vite_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ---------- 所有其他请求代理到 vite dev server ----------
    location / {
        proxy_pass http://vite_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# =============================================================================
# 老域名入口（a/b/c.local）→ 同样代理到 vite dev server
# basename 由前端根据 hostname 自动判断
# =============================================================================
server {
    listen 80;
    server_name a.local b.local c.local;

    access_log /tmp/legacy.local.access.log;
    error_log  /tmp/legacy.local.error.log warn;

    add_header X-Dev-Mode "legacy-domain" always;

    # Vite HMR
    location /@vite/ {
        proxy_pass http://vite_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # 所有请求代理到 vite
    location / {
        proxy_pass http://vite_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}